<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>WebS</title>
</head>
<body>
    <div class="main-content-wrapper">
        <!-- navbar -->
        <nav class="navbar">
            <svg class="logo" xmlns="http://www.w3.org/2000/svg" id="Outline" viewBox="0 0 24 24" width="40" height="40"><path d="M22.766,4.566A1.994,1.994,0,0,0,20.586,5L18,7.586,13.414,3a2,2,0,0,0-2.828,0L6,7.586,3.414,5A2,2,0,0,0,0,6.414V17a5.006,5.006,0,0,0,5,5H19a5.006,5.006,0,0,0,5-5V6.414A2,2,0,0,0,22.766,4.566ZM22,17a3,3,0,0,1-3,3H5a3,3,0,0,1-3-3V6.414L5.293,9.707a1,1,0,0,0,1.414,0L12,4.414l5.293,5.293a1,1,0,0,0,1.414,0L22,6.414Z"/></svg>
            
            <ul class="navbar-user">
                <li><a class="btn btn-seconday" href="">Login</a></li>
                <li><a class="btn btn-primary" href="">Sign up</a></li>
            </ul>
        </nav>


        <!-- hero section -->
        <section class="hero-section">
            <div class="openings">
                <h2 class="hero-heading">Web Scrapper</h2>
                <p class="hero-body">Extract info of your favorite websites instantly.</p>
            </div>

            <div class="url-area">
                <input class="url-input" type="url" placeholder="https://example.com">
                <!-- <a class="submit-button btn btn-primary" href="">Let's Scrap</a> -->
                <button class="submit-button btn">Let's Scrap</button>
            </div>
        </section>


        <!-- loading section -->
        <section class="loading-section">
            <div class="loader"></div>
            <p>Analyzing website...</p>

        </section>


        <!-- error section -->
        <section class="error-message">
            <p class="error-text"></p>
        </section>
        

        <!-- result section -->
        <section class="result-section">
            <h2 class="result-box-heading">Summay</h2>

            <div class="result-box">
                <!-- AI response here -->
            </div>
        </section>

        <!-- footer -->
        <section class="footer">
            <small>&copy; WebS 2026 - Your Web Scrapper</small>
        </section>
    </div>
    <script src="js/app.js" type="module"></script>
</body>
</html>
