    <title>AI Knowledge Extraction Platform</title>
</head>
<body>
    <div class="main-content-wrapper">

        <nav class="navbar">

                <li><a class="btn btn-seconday" href="">Login</a></li>
                <li><a class="btn btn-primary" href="">Sign up</a></li>
            </ul> -->
        </nav>


        <!-- hero section -->
        <section class="hero-section">
            <div class="openings">
                <h3 class="hero-heading">AI Knowledge Extraction Platform</h3>
                <p class="hero-body">Extract meaningful information of your favorite websites eaisly.</p>
            </div>

            <div class="url-area">
                <input class="url-input" type="url" placeholder="enter website url (example: https://www.example.com)">
                <!-- <a class="submit-button btn btn-primary" href="">Let's Scrap</a> -->
                <button class="submit-button btn">Let's Analyze</button>
            </div>

            <div class="loading-error-area">
                <div class="loader-area">
                    <div class="loader"></div>
                    <p>Analyzing website...</p>
                </div>

                <div class="error-message-area">
                    <p class="error-text"></p>
                </div>
            </div>
        </section>


        <!-- result section -->
        <section class="result-section">
            <h2 class="result-box-heading">Summay</h2>

            <div class="result-box">
                <!-- AI response here -->
            </div>
        </section>

        <!-- footer -->
        <section class="footer">
            <small>&copy; AI Knowledge Extraction Platform 2026 - Your Web Scrapper</small>
        </section>
    </div>
    <script src="js/validator.js"></script>
    <script src="js/app.js"></script>
